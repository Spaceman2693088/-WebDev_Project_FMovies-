<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>FMovies+</title>
</head>
<body class="loginPage">
<nav id="header">
    <div id="red">
        <img width="300" height="100" src="FMovies_Logo.png" alt="Website Logo"/>
        <button onclick="window.location.href='index.html'">Home</button>
    </div>
    <div id="blue">
        <input id="search-input" type="text" placeholder="Search..">
        <button onclick="window.location.href='about.html'">About</button>
        <button onclick="window.location.href='login.html'">Sign Up or Log In</button>
        <button onclick="window.location.href='list.html'">My List</button>
    
    </div>
</nav>

<div id="signup-container">
    <h1 style="text-decoration: underline;">Sign Up</h1>
</br>
    <form id="signup-form">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Sign Up</button>
        <div id="checkbox-nav">
            <div id="remember-me">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me">Remember Me</label>
            </div>
            <div id="email-updates">
                <input type="checkbox" id="email" name="email">
                <label for="email">Receive Email Updates</label>
            </div>
        </div>
    </form>
    </br>
    <p>Have an account? <a href="login.html">Log In</a></p>

<p id="copyright"> <em><strong>Copyright © 2023 FMovies+. All rights reserved. <a href="https://www.ipoi.gov.ie/media/i52bg0uj/copyright-booklet-english.pdf">Private Policy</a></strong></em></p>
</body>
</html>
